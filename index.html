<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Página de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Produtos</h1>
        <p>Bem vindo a minha loja! Confira abaixo os melhores equipamentos de informática.</p>
        <div>
            <input type="text" id="input-busca" placeholder="Digite um produto...">
            <button id="btn-buscar">Buscar</button>
        </div>
    </header>

    <main>
        <div id="msg-carrinho" class="oculto">Produto adicionado ao carrinho!</div>

        <section class="container">
            <div class="produto">
                <h3>Notebook Dell</h3>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTb9QvnWOjzpQXuWpyPIq4dRv90Zgpb4BqrmjJuOtxSCQ&s" alt="Notebook da marca dell em funcionamento">
                <p><span class="preco">R$ 5.000</span></p>
                <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">Detalhes</a>
                <br>
                <button class="btn-comprar">Comprar</button>
            </div>

            <div class="produto">
                <h3>Placa de Vídeo 5060 MSI</h3>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTRfnoILjxaTk5nPdNhxVTNzaRDe28J60Tq5-xvaqHY_w&s=10" alt="Placa de Vídeo 2 fans com sua caixa ao lado">
                <p><span class="preco">R$ 2.450</span></p>
                <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">Detalhes</a>
                <br>
                <button class="btn-comprar">Comprar</button>
            </div>

            <div class="produto">
                <h3>Monitor Full HD white label</h3>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSkgrMX3SZvYoIwCGYu2whJQxhsy0wHnezmN5CHLPB2Gw&s=10" alt="Monitor de computador ligado com uma imagem da praia">
                <p><span class="preco">R$ 550</span></p>
                <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">Detalhes</a>
                <br>
                <button class="btn-comprar">Comprar</button>
            </div>
        </section>

        <section>
            <h2>Fale Conosco</h2>
            <form id="form-contato">
                <label>
                    Nome:
                    <input type="text" id="nome">
                </label>
                <label>
                    Email:
                    <input type="email" id="email">
                </label>
                <label>
                    Mensagem:
                    <textarea id="mensagem"></textarea>
                </label>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Minha loja</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
